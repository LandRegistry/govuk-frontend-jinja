[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[project]
name = "govuk-frontend-jinja"
version = "4.2.0"
dependencies = ["jinja2!=3.0.0,!=3.0.1"]
requires-python = ">=3.11"
authors = [
    { name = "Matt Shaw", email = "matthew.shaw@landregistry.gov.uk" },
    { name = "Andy Mantell" },
]
maintainers = [
    { name = "Matt Shaw", email = "matthew.shaw@landregistry.gov.uk" },
]
description = "GOV.UK Frontend Jinja Macros"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "component",
    "design system",
    "frontend",
    "govuk-frontend",
    "govuk",
    "jinja",
    "macros",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Text Processing :: Markup :: HTML",
]

[project.urls]
Homepage = "https://github.com/LandRegistry/govuk-frontend-jinja"
Issues = "https://github.com/LandRegistry/govuk-frontend-jinja/issues"
Changelog = "https://github.com/LandRegistry/govuk-frontend-jinja/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "flake8",
    "flake8-pyproject",
    "flask",
]

[tool.uv.build-backend]
module-name = "govuk_frontend_jinja"
module-root = ""

# ----------------------------
# Developer tooling configs
# ----------------------------

[tool.flake8]
exclude = [".venv"]
ignore = ["E203", "W503"]
max-complexity = 10
max-line-length = 120

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 120
