# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
          cache-suffix: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --all-groups --python ${{ matrix.python-version }}

      # Security check
      - name: Check dependencies for known vulnerabilities
        run: uv audit --preview-features audit-command --locked --python-version ${{ matrix.python-version }} --ignore GHSA-4xh5-x5gv-qwph

      # Linting
      - name: Lint with flake8
        run: |
          uv run --locked --python ${{ matrix.python-version }} flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          uv run --locked --python ${{ matrix.python-version }} flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      # Prepare external test tools
      - name: Prepare test tools
        run: |
          sudo apt-get update && sudo apt-get install -y wait-for-it curl
          curl -L https://github.com/matthew-shaw/govuk-frontend-diff/releases/download/v2.0.0/govuk-frontend-diff-linux \
            --output govuk-frontend-diff
          chmod +x ./govuk-frontend-diff

      # Run Flask test server and govuk-frontend-diff
      - name: Run tests with govuk-frontend-diff
        run: |
          (cd tests/utils && nohup uv run --project ../.. --locked --python ${{ matrix.python-version }} python -m flask run --port 3000 &)
          wait-for-it localhost:3000
          ./govuk-frontend-diff http://localhost:3000 --govuk-frontend-version=v6.5.1 --exclude page-template --ci
